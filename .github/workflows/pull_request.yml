name: Pull Requests

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  pullRequestHandler:
    name: PullRequestHandler
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: PullRequestHandler
        uses: ScoopInstaller/GithubActions@a709983c0692a8a853c288cf5e9bf14658107936 # pinned upstream commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
