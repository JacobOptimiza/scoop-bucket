name: Pull Requests

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  pullRequestHandler:
    name: PullRequestHandler
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PullRequestHandler
        uses: ScoopInstaller/GithubActions@8720dc58b31abbfe1f0b9c21f5fff6ba6dd96dd3 # pinned upstream commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
