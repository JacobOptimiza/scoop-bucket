name: Excavator

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  excavate:
    name: Excavate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Excavate
        uses: ScoopInstaller/GithubActions@8720dc58b31abbfe1f0b9c21f5fff6ba6dd96dd3 # pinned upstream commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_UPDATED: 1
